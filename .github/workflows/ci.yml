name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Une seule exécution par branche : les pushes successifs annulent la précédente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mfp
          POSTGRES_PASSWORD: mfp
          POSTGRES_DB: mfp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mfp -d mfp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: cle-de-test-ci-uniquement
      DATABASE_URL: postgres://mfp:mfp@localhost:5432/mfp
      # Les tests utilisent un cache mémoire et Celery en mode eager : aucun
      # service Redis n'est nécessaire ici.
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (ruff)
        run: ruff format --check .

      - name: Vérifier l'absence de migration manquante
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Tests (pytest)
        run: pytest

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mfp
          POSTGRES_PASSWORD: mfp
          POSTGRES_DB: mfp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mfp -d mfp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      E2E_PYTHON: python
      E2E_DATABASE_URL: postgres://mfp:mfp@localhost:5432/mfp
      E2E_REDIS_URL: redis://localhost:6379/5
      # Le stockage objet des photos de progression. Les deux adresses sont
      # **volontairement différentes** : le backend signe pour la seconde, que
      # le navigateur doit pouvoir joindre. Les faire coïncider masquerait un
      # défaut d'adresse, comme cela s'est déjà produit.
      E2E_S3_ENDPOINT_URL: http://127.0.0.1:9002
      E2E_S3_PUBLIC_ENDPOINT_URL: http://localhost:9002
      E2E_S3_BUCKET_NAME: mfp-photos
      MINIO_IMAGE: minio/minio:RELEASE.2025-04-22T22-12-26Z

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # MinIO démarre dans une étape et non en `services` : un conteneur de
      # service ne reçoit pas d'arguments de commande, et l'image officielle en
      # exige un. Même image épinglée qu'en local, pour que la CI éprouve ce
      # que le poste de développement éprouve.
      - name: Démarrer le stockage objet
        run: |
          docker run -d --name minio -p 9002:9000 \
            -e MINIO_ROOT_USER=mfp-local \
            -e MINIO_ROOT_PASSWORD=mfp-local-secret \
            "$MINIO_IMAGE" server /data

          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:9002/minio/health/live > /dev/null; then
              echo "MinIO prêt après ${attempt} tentative(s)."
              exit 0
            fi
            sleep 2
          done

          echo "MinIO n'a pas démarré." >&2
          docker logs minio >&2
          exit 1

      - name: Installer les dépendances backend
        run: pip install -r requirements-dev.txt
        working-directory: backend

      # Le seau est créé par boto3 plutôt que par le client `mc` : c'est le
      # client que l'application utilise, il est déjà installé, et cela évite
      # une seconde image dont le réseau se configure autrement selon l'hôte.
      - name: Créer le seau
        run: |
          python - <<'PYTHON'
          import os

          import boto3
          from botocore.exceptions import ClientError

          client = boto3.client(
              "s3",
              endpoint_url=os.environ["E2E_S3_ENDPOINT_URL"],
              aws_access_key_id="mfp-local",
              aws_secret_access_key="mfp-local-secret",
              region_name="us-east-1",
          )
          bucket = os.environ["E2E_S3_BUCKET_NAME"]
          try:
              client.create_bucket(Bucket=bucket)
          except ClientError as error:
              if error.response["Error"]["Code"] not in {"BucketAlreadyOwnedByYou", "BucketAlreadyExists"}:
                  raise
          print(f"Seau {bucket} prêt.")
          PYTHON
        working-directory: backend

      - name: Installer les dépendances frontend
        run: npm ci
        working-directory: frontend

      - name: Restaurer le cache des navigateurs
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Parcours de bout en bout
        run: npm run test:e2e
        working-directory: frontend
        env:
          # Le parcours aliments importe lui-même l'extrait Ciqual versionné.
          E2E_PYTHON: python

      - name: Publier le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
