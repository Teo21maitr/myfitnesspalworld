name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Une seule exécution par branche : les pushes successifs annulent la précédente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mfp
          POSTGRES_PASSWORD: mfp
          POSTGRES_DB: mfp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mfp -d mfp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: cle-de-test-ci-uniquement
      DATABASE_URL: postgres://mfp:mfp@localhost:5432/mfp
      # Les tests utilisent un cache mémoire et Celery en mode eager : aucun
      # service Redis n'est nécessaire ici.
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (ruff)
        run: ruff format --check .

      - name: Vérifier l'absence de migration manquante
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Tests (pytest)
        run: pytest

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm run test

      # `VITE_API_BASE_URL` est figée dans le bundle : `vite.config.ts` refuse
      # désormais de construire sans elle. La valeur importe peu ici — ce qui
      # compte est que la construction soit déclarée quelque part.
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com/api/v1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mfp
          POSTGRES_PASSWORD: mfp
          POSTGRES_DB: mfp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mfp -d mfp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      E2E_PYTHON: python
      E2E_DATABASE_URL: postgres://mfp:mfp@localhost:5432/mfp
      E2E_REDIS_URL: redis://localhost:6379/5
      # Le stockage objet des photos de progression. Les deux adresses sont
      # **volontairement différentes** : le backend signe pour la seconde, que
      # le navigateur doit pouvoir joindre. Les faire coïncider masquerait un
      # défaut d'adresse, comme cela s'est déjà produit.
      E2E_S3_ENDPOINT_URL: http://127.0.0.1:9002
      E2E_S3_PUBLIC_ENDPOINT_URL: http://localhost:9002
      E2E_S3_BUCKET_NAME: mfp-photos
      MINIO_IMAGE: minio/minio:RELEASE.2025-04-22T22-12-26Z

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # MinIO démarre dans une étape et non en `services` : un conteneur de
      # service ne reçoit pas d'arguments de commande, et l'image officielle en
      # exige un. Même image épinglée qu'en local, pour que la CI éprouve ce
      # que le poste de développement éprouve.
      - name: Démarrer le stockage objet
        run: |
          docker run -d --name minio -p 9002:9000 \
            -e MINIO_ROOT_USER=mfp-local \
            -e MINIO_ROOT_PASSWORD=mfp-local-secret \
            "$MINIO_IMAGE" server /data

          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:9002/minio/health/live > /dev/null; then
              echo "MinIO prêt après ${attempt} tentative(s)."
              exit 0
            fi
            sleep 2
          done

          echo "MinIO n'a pas démarré." >&2
          docker logs minio >&2
          exit 1

      - name: Installer les dépendances backend
        run: pip install -r requirements-dev.txt
        working-directory: backend

      # Le seau est créé par boto3 plutôt que par le client `mc` : c'est le
      # client que l'application utilise, il est déjà installé, et cela évite
      # une seconde image dont le réseau se configure autrement selon l'hôte.
      - name: Créer le seau
        run: |
          python - <<'PYTHON'
          import os

          import boto3
          from botocore.exceptions import ClientError

          client = boto3.client(
              "s3",
              endpoint_url=os.environ["E2E_S3_ENDPOINT_URL"],
              aws_access_key_id="mfp-local",
              aws_secret_access_key="mfp-local-secret",
              region_name="us-east-1",
          )
          bucket = os.environ["E2E_S3_BUCKET_NAME"]
          try:
              client.create_bucket(Bucket=bucket)
          except ClientError as error:
              if error.response["Error"]["Code"] not in {"BucketAlreadyOwnedByYou", "BucketAlreadyExists"}:
                  raise
          print(f"Seau {bucket} prêt.")
          PYTHON
        working-directory: backend

      - name: Installer les dépendances frontend
        run: npm ci
        working-directory: frontend

      - name: Restaurer le cache des navigateurs
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Parcours de bout en bout
        run: npm run test:e2e
        working-directory: frontend
        env:
          # Le parcours aliments importe lui-même l'extrait Ciqual versionné.
          E2E_PYTHON: python

      - name: Publier le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  deploy:
    name: Images de production
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mfp
          POSTGRES_PASSWORD: mfp
          POSTGRES_DB: mfp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mfp -d mfp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Valeurs jetables : ce job éprouve la **configuration**, pas un secret.
      DJANGO_SETTINGS_MODULE: config.settings.production
      # Assez longue et variée pour satisfaire security.W009 : la contrôler
      # est justement l'objet de ce job.
      DJANGO_SECRET_KEY: kQ7x-Zr2@Lm9pTvB!4nWyE6sHc0JdRfUgAeXoIzMbNqYtPlCkV3
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      CSRF_TRUSTED_ORIGINS: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      BACKEND_URL: http://localhost:8000
      DEFAULT_FROM_EMAIL: ci@example.com
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      SECURE_SSL_REDIRECT: "False"
      AI_PROVIDER: anthropic

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances de production
        run: pip install -r requirements.txt
        working-directory: backend

      # Le contrôle de déploiement de Django : cookies, HSTS, DEBUG, hôtes.
      - name: Contrôle de déploiement
        run: python manage.py check --deploy --fail-level WARNING
        working-directory: backend
        env:
          DATABASE_URL: postgres://mfp:mfp@localhost:5432/mfp
          REDIS_URL: redis://localhost:6379/0
          # Sa vraie valeur de production. Le conteneur démarré plus bas la
          # désactive pour que `curl` puisse l'atteindre en HTTP — mais le
          # contrôle, lui, doit porter sur ce qui sera réellement déployé.
          SECURE_SSL_REDIRECT: "True"

      - name: Construire les images
        run: |
          docker build --target production -t mfp-backend:ci backend
          docker build --target production \
            --build-arg VITE_API_BASE_URL=https://api.example.com/api/v1 \
            -t mfp-frontend:ci frontend

      # Le cœur de ce job. Ces deux appels sont ce qui exerce enfin la surface
      # de déploiement : ni `pytest`, ni `check --deploy` ne diraient qu'un
      # manifeste statique manque.
      - name: Démarrer le backend de production
        run: |
          docker run -d --name backend --network host \
            -e DJANGO_SECRET_KEY -e DJANGO_ALLOWED_HOSTS \
            -e CORS_ALLOWED_ORIGINS -e CSRF_TRUSTED_ORIGINS \
            -e FRONTEND_URL -e BACKEND_URL -e DEFAULT_FROM_EMAIL \
            -e EMAIL_BACKEND -e SECURE_SSL_REDIRECT -e AI_PROVIDER \
            -e DATABASE_URL=postgres://mfp:mfp@localhost:5432/mfp \
            -e REDIS_URL=redis://localhost:6379/0 \
            mfp-backend:ci

          docker exec backend python manage.py migrate --noinput

          for attempt in $(seq 1 20); do
            if curl -sf http://localhost:8000/health/ > /dev/null; then
              echo "Backend prêt après ${attempt} tentative(s)."
              break
            fi
            sleep 2
          done

      - name: Le healthcheck répond
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health/)
          test "$code" = "200" || { docker logs backend; echo "health=$code"; exit 1; }

      # C'est cette étape, et elle seule, qui prouve que `collectstatic` a
      # tourné : sans manifeste, whitenoise ne casse ni au démarrage ni sur
      # `/health/`, mais à l'ouverture de la première page d'admin.
      - name: Une page d'admin se charge
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/admin/login/)
          test "$code" = "200" || { docker logs backend; echo "admin=$code"; exit 1; }

      # Reproduit la sonde de la plateforme **telle qu'elle arrive vraiment** :
      # en clair, sur le réseau interne, avec un `Host` qui n'est pas le domaine
      # public. Deux réglages de `production.py` la rendent possible, et aucun
      # des appels ci-dessus ne les exerce — le conteneur précédent a la
      # redirection HTTPS désactivée et répond sur son propre hôte.
      #
      # C'est la panne qui a coûté deux déploiements à l'étape 19, et la plus
      # trompeuse : healthcheck en échec, la plateforme garde l'ancien
      # conteneur, l'application répond — donc tout paraît déployé.
      - name: La sonde de la plateforme aboutit
        run: |
          docker run -d --name sonde --network host \
            -e PORT=8002 \
            -e DJANGO_SECRET_KEY -e CORS_ALLOWED_ORIGINS -e CSRF_TRUSTED_ORIGINS \
            -e FRONTEND_URL -e BACKEND_URL -e DEFAULT_FROM_EMAIL \
            -e EMAIL_BACKEND -e AI_PROVIDER \
            -e DJANGO_ALLOWED_HOSTS=api.example.com \
            -e SECURE_SSL_REDIRECT=True \
            -e DATABASE_URL=postgres://mfp:mfp@localhost:5432/mfp \
            -e REDIS_URL=redis://localhost:6379/0 \
            mfp-backend:ci

          for attempt in $(seq 1 20); do
            curl -s -o /dev/null -H 'Host: healthcheck.railway.app' \
              http://localhost:8002/health/ && break
            sleep 2
          done

          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Host: healthcheck.railway.app' http://localhost:8002/health/)
          docker rm -f sonde > /dev/null
          case "$code" in
            200) ;;
            400) echo "healthcheck.railway.app absent d'ALLOWED_HOSTS." >&2; exit 1 ;;
            30*) echo "La sonde est redirigée vers HTTPS (code $code)." >&2; exit 1 ;;
            *)   echo "Sonde inattendue : $code" >&2; exit 1 ;;
          esac

      - name: L'image de production ne contient pas les outils de test
        run: |
          if docker run --rm mfp-backend:ci pip show pytest > /dev/null 2>&1; then
            echo "pytest est présent dans l'image de production." >&2
            exit 1
          fi

      - name: Le frontend sert son repli SPA
        run: |
          docker run -d --name frontend -p 8080:8080 mfp-frontend:ci

          for attempt in $(seq 1 20); do
            if curl -sf http://localhost:8080/ > /dev/null; then break; fi
            sleep 2
          done

          # Une route profonde doit rendre l'application, pas un 404 : le
          # routage vit dans le navigateur.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/journal)
          test "$code" = "200" || { docker logs frontend; echo "spa=$code"; exit 1; }

          curl -s http://localhost:8080/journal | grep -q 'id="root"' \
            || { echo "Le repli SPA ne rend pas l'application." >&2; exit 1; }

