name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Une seule exécution par branche : les pushes successifs annulent la précédente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mfp
          POSTGRES_PASSWORD: mfp
          POSTGRES_DB: mfp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mfp -d mfp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: cle-de-test-ci-uniquement
      DATABASE_URL: postgres://mfp:mfp@localhost:5432/mfp
      # Les tests utilisent un cache mémoire et Celery en mode eager : aucun
      # service Redis n'est nécessaire ici.
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (ruff)
        run: ruff format --check .

      - name: Vérifier l'absence de migration manquante
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Tests (pytest)
        run: pytest

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mfp
          POSTGRES_PASSWORD: mfp
          POSTGRES_DB: mfp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mfp -d mfp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      E2E_PYTHON: python
      E2E_DATABASE_URL: postgres://mfp:mfp@localhost:5432/mfp
      E2E_REDIS_URL: redis://localhost:6379/5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances backend
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Installer les dépendances frontend
        run: npm ci
        working-directory: frontend

      - name: Restaurer le cache des navigateurs
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Parcours de bout en bout
        run: npm run test:e2e
        working-directory: frontend
        env:
          # Le parcours aliments importe lui-même l'extrait Ciqual versionné.
          E2E_PYTHON: python

      - name: Publier le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
