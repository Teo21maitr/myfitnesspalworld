# Environnement de développement local complet.
#
#   docker compose up
#
# Les ports publiés sur l'hôte sont configurables via le `.env` afin de
# cohabiter avec d'autres projets (voir BACKEND_PORT, POSTGRES_PORT, ...).

name: myfitnesspalworld

x-backend-env: &backend-env
  # Les conteneurs joignent les services par leur nom sur le réseau compose :
  # ces valeurs remplacent celles du `.env`, qui visent l'hôte.
  DJANGO_SETTINGS_MODULE: config.settings.local
  DATABASE_URL: postgres://${POSTGRES_USER:-mfp}:${POSTGRES_PASSWORD:-mfp}@db:5432/${POSTGRES_DB:-mfp}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  # Stockage objet local. Le seau est privé : les photos ne sont lisibles
  # que par une URL signée courte, jamais par une adresse permanente.
  S3_ENDPOINT_URL: http://minio:9000
  # Ce que le **navigateur** peut joindre. Le nom `minio` n'existe que dans le
  # réseau compose : une URL signée pour lui ne s'ouvrirait nulle part.
  S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT:-9002}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-mfp-local}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-mfp-local-secret}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-mfp-photos}
  S3_REGION: us-east-1
  # Les emails partent vers Mailpit, qui les capture sans rien envoyer.
  EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  EMAIL_USE_TLS: "False"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mfp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mfp}
      POSTGRES_DB: ${POSTGRES_DB:-mfp}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mfp} -d ${POSTGRES_DB:-mfp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Stockage objet S3-compatible, pour développer et éprouver les photos de
    # progression sans dépendre d'un fournisseur (spec 09 §17). Le seau est
    # créé au démarrage par `createbuckets`, et reste privé.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mfp-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mfp-local-secret}
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    # Conteneur éphémère : crée le seau puis s'arrête. Aucune politique
    # publique n'est posée — c'est tout l'intérêt.
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-mfp-local} ${MINIO_ROOT_PASSWORD:-mfp-local-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET_NAME:-mfp-photos}
      "

  mailpit:
    # Capture tous les emails de développement et les expose dans une
    # interface web : le lien de réinitialisation est cliquable directement.
    image: axllent/mailpit:v1.31
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A config worker -l info
    env_file:
      - .env
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    # Ordonnanceur des rappels, du nettoyage des fichiers temporaires et du
    # rafraîchissement des caches externes (spec 09 §10). Aucune tâche
    # planifiée n'est encore définie.
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      # Le navigateur de l'hôte appelle l'API par le port publié.
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8001}/api/v1
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # Conserve les node_modules installés dans l'image.
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
